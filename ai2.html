<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Iter | Premium AI Itinerary Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.7); }
        .card-shadow { box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05); }
        .btn-primary { @apply bg-emerald-600 text-white font-bold py-3 px-6 rounded-xl hover:bg-emerald-700 transition-all active:scale-95 shadow-lg shadow-emerald-200; }
        .btn-secondary { @apply bg-white border border-slate-200 text-slate-700 font-bold py-2 px-4 rounded-lg hover:bg-slate-50 transition-all text-xs; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            .glass { border: none !important; box-shadow: none !important; background: white !important; }
            .card-shadow { box-shadow: none !important; }
            .print-break { page-break-inside: avoid; border-bottom: 1px solid #e2e8f0 !important; }
            .bg-slate-900 { background-color: #0f172a !important; color: white !important; -webkit-print-color-adjust: exact; }
            .text-emerald-600 { color: #059669 !important; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1 no-print">
                    <span class="bg-emerald-500 w-3 h-3 rounded-full animate-pulse"></span>
                    <span id="connection-status" class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Initializing Engine...</span>
                </div>
                <h1 class="text-4xl font-black tracking-tight">LUXE <span class="text-emerald-600">ITER</span></h1>
                <p class="text-slate-500 font-medium">Global Itinerary Optimization Engine</p>
            </div>
            <div class="flex gap-3 no-print">
                <button onclick="window.print()" class="btn-primary flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Export PDF Proposal
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6 no-print">
                <div class="glass p-6 rounded-[2rem] card-shadow space-y-6">
                    <h2 class="text-lg font-extrabold flex items-center gap-3">
                        <span class="w-8 h-8 bg-slate-900 text-white rounded-lg flex items-center justify-center text-sm">01</span>
                        Route Planning
                    </h2>
                    <div class="space-y-4">
                        <div class="flex gap-2">
                            <div class="flex-1">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">City</label>
                                <input type="text" list="cityList" id="cityInput" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="e.g. London">
                            </div>
                            <div class="w-24">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Nights</label>
                                <input type="number" id="nightInput" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="3">
                            </div>
                        </div>
                        <button onclick="addCityToRoute()" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-all">+ Add Stop</button>
                    </div>
                    <div id="routeList" class="space-y-2"></div>
                </div>

                <div class="glass p-6 rounded-[2rem] card-shadow space-y-6">
                    <h2 class="text-lg font-extrabold flex items-center gap-3">
                        <span class="w-8 h-8 bg-slate-900 text-white rounded-lg flex items-center justify-center text-sm">02</span>
                        Budget & Margins
                    </h2>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Hotel Cap (Net)</label>
                                <input type="number" id="hotelBudget" class="w-full px-4 py-3 rounded-xl border border-slate-200" value="300000">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Sight Cap (Net)</label>
                                <input type="number" id="sightBudget" class="w-full px-4 py-3 rounded-xl border border-slate-200" value="80000">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Markup %</label>
                                <input type="number" id="markupInput" oninput="recalcAll()" class="w-full px-4 py-3 rounded-xl border border-slate-200" value="15">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">GST %</label>
                                <input type="number" id="gstInput" oninput="recalcAll()" class="w-full px-4 py-3 rounded-xl border border-slate-200" value="5">
                            </div>
                        </div>
                        <button onclick="runOptimizer()" class="btn-primary w-full text-sm tracking-widest uppercase">Generate Optimal Proposal</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <div class="glass p-8 rounded-[2rem] card-shadow bg-slate-900 text-white">
                    <div class="flex flex-wrap justify-between items-end gap-6">
                        <div>
                            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Grand Total Investment</p>
                            <h3 id="resGrandTotal" class="text-6xl font-black text-emerald-400 tracking-tighter">₹0</h3>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 border-t border-slate-800 pt-6 w-full">
                            <div>
                                <p class="text-slate-500 text-[9px] uppercase font-black">Hotels (Net)</p>
                                <p id="resHotelUsed" class="text-sm font-bold">₹0</p>
                            </div>
                            <div>
                                <p class="text-slate-500 text-[9px] uppercase font-black">Sights (Net)</p>
                                <p id="resSightUsed" class="text-sm font-bold">₹0</p>
                            </div>
                            <div>
                                <p class="text-slate-500 text-[9px] uppercase font-black">Markup</p>
                                <p id="resMarkupVal" class="text-sm font-bold text-emerald-500">₹0</p>
                            </div>
                            <div>
                                <p class="text-slate-500 text-[9px] uppercase font-black">GST Amount</p>
                                <p id="resGstVal" class="text-sm font-bold">₹0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="proposalSection" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div class="glass rounded-[2rem] card-shadow overflow-hidden bg-white">
                        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                            <h3 class="font-black text-slate-900 uppercase tracking-tight">Your Custom Itinerary</h3>
                            <span class="text-[10px] bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-bold uppercase">Budget Optimized</span>
                        </div>
                        <div id="proposalBody" class="divide-y divide-slate-100"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="swapModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass bg-white w-full max-w-2xl rounded-[2rem] max-h-[80vh] flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 id="modalTitle" class="text-xl font-black uppercase tracking-tight">Select Option</h3>
                <button onclick="closeModal()" class="text-slate-300 hover:text-slate-900 text-3xl">&times;</button>
            </div>
            <div id="modalContent" class="p-6 overflow-y-auto space-y-3"></div>
        </div>
    </div>

    <datalist id="cityList"></datalist>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzYbmpf1dOUVJ2JAxr5UVeFCQL6sT6AaHP9N6gguF0Z0qaotsFJEzHa5jQnO39wsKMRnA/exec";
    let masterData = { hotels: [], sights: [] };
    let selectedRoute = []; 
    let currentPlan = [];

    async function init() {
        try {
            const res = await fetch(API_URL);
            masterData = await res.json();
            document.getElementById('connection-status').innerText = "System Ready";
            const cities = [...new Set(masterData.hotels.map(h => h.city))];
            document.getElementById('cityList').innerHTML = cities.map(c => `<option value="${c}">`).join('');
        } catch (e) { 
            document.getElementById('connection-status').innerText = "Database Offline";
        }
    }

    function addCityToRoute() {
        const city = document.getElementById('cityInput').value.trim();
        const nights = parseInt(document.getElementById('nightInput').value);
        if(!city || isNaN(nights)) return;
        selectedRoute.push({ id: Date.now(), city, nights });
        renderRoute();
        document.getElementById('cityInput').value = "";
        document.getElementById('nightInput').value = "";
    }

    function renderRoute() {
        const list = document.getElementById('routeList');
        list.innerHTML = selectedRoute.map((item, index) => `
            <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
                <div class="flex items-center gap-3">
                    <span class="text-emerald-500 font-bold">${index+1}</span>
                    <span class="font-bold text-slate-700">${item.city}</span>
                    <span class="text-[10px] bg-slate-100 px-2 py-1 rounded text-slate-500 font-bold uppercase">${item.nights} Nts</span>
                </div>
                <button onclick="removeCity(${item.id})" class="text-slate-300 hover:text-red-500 text-xl">&times;</button>
            </div>
        `).join('');
    }

    function removeCity(id) {
        selectedRoute = selectedRoute.filter(r => r.id !== id);
        renderRoute();
    }

    function runOptimizer() {
        const totalHBudget = parseFloat(document.getElementById('hotelBudget').value);
        const totalSBudget = parseFloat(document.getElementById('sightBudget').value);
        
        if(selectedRoute.length === 0) return alert("Please define your route first.");

        const totalNights = selectedRoute.reduce((sum, r) => sum + r.nights, 0);

        currentPlan = selectedRoute.map(routeItem => {
            // Proportional Budget Allocation
            const weight = routeItem.nights / totalNights;
            const cityHCap = totalHBudget * weight;
            const citySCap = totalSBudget / selectedRoute.length;

            const availableHotels = masterData.hotels
                .filter(h => h.city.toLowerCase() === routeItem.city.toLowerCase())
                .sort((a, b) => b.cost - a.cost);

            // Find best luxury hotel within proportional cap
            const bestHotel = availableHotels.find(h => (h.cost * routeItem.nights) <= cityHCap) || availableHotels[availableHotels.length - 1];
            
            // Allocate sights within cap
            const citySights = masterData.sights.filter(s => s.city.toLowerCase().includes(routeItem.city.toLowerCase()));
            let chosenSights = [];
            let sCost = 0;
            citySights.forEach(s => {
                if(sCost + s.price <= citySCap) {
                    chosenSights.push(s);
                    sCost += s.price;
                }
            });

            return {
                id: routeItem.id,
                city: routeItem.city,
                nights: routeItem.nights,
                hotel: bestHotel,
                sights: chosenSights
            };
        });

        renderProposal();
        document.getElementById('proposalSection').classList.remove('hidden');
    }

    function renderProposal() {
        const body = document.getElementById('proposalBody');
        let hTotal = 0;
        let sTotal = 0;

        body.innerHTML = currentPlan.map((item, idx) => {
            const hCost = (item.hotel?.cost || 0) * item.nights;
            const sCost = item.sights.reduce((sum, s) => sum + s.price, 0);
            hTotal += hCost;
            sTotal += sCost;

            return `
                <div class="p-8 flex flex-col md:flex-row gap-8 hover:bg-slate-50/50 transition-colors print-break">
                    <div class="md:w-1/4">
                        <span class="text-[10px] font-black text-emerald-600 tracking-widest uppercase">Stop 0${idx+1}</span>
                        <h4 class="text-3xl font-black text-slate-900">${item.city}</h4>
                        <p class="text-slate-400 font-bold uppercase text-xs tracking-widest">${item.nights} Nights Stay</p>
                    </div>
                    
                    <div class="flex-1 space-y-6">
                        <div>
                            <div class="flex justify-between items-start mb-1">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">Accommodation</label>
                                <button onclick="openHotelSwap(${item.id})" class="text-emerald-600 font-black text-[10px] uppercase hover:underline no-print">Swap Hotel</button>
                            </div>
                            <p class="font-extrabold text-slate-800 text-lg">${item.hotel?.name || 'Selection Pending'}</p>
                            <p class="text-xs text-slate-500 font-bold uppercase">${item.hotel?.type} Category • ₹${item.hotel?.cost.toLocaleString('en-IN')}/night</p>
                        </div>
                        
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">Curated Experiences</label>
                                <button onclick="openSightSwap(${item.id})" class="bg-slate-900 text-white px-3 py-1 rounded-full text-[9px] font-black uppercase no-print">Edit Activities</button>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${item.sights.length > 0 ? item.sights.map(s => `
                                    <span class="bg-emerald-50 border border-emerald-100 px-3 py-1.5 rounded-xl text-xs font-bold text-emerald-800 shadow-sm">
                                        ${s.info} <span class="ml-1 font-black opacity-40">₹${s.price.toLocaleString('en-IN')}</span>
                                    </span>
                                `).join('') : '<span class="text-slate-400 text-xs italic">No activities selected</span>'}
                            </div>
                        </div>
                    </div>

                    <div class="md:w-1/4 text-right border-l border-slate-100 pl-6">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Subtotal</p>
                        <p class="text-2xl font-black text-slate-900">₹${(hCost + sCost).toLocaleString('en-IN')}</p>
                    </div>
                </div>
            `;
        }).join('');

        updateTotals(hTotal, sTotal);
    }

    function updateTotals(hCost, sCost) {
        const mPct = parseFloat(document.getElementById('markupInput').value) || 0;
        const gPct = parseFloat(document.getElementById('gstInput').value) || 0;

        const net = hCost + sCost;
        const markupVal = net * (mPct / 100);
        const gstVal = (net + markupVal) * (gPct / 100);
        const total = net + markupVal + gstVal;

        document.getElementById('resHotelUsed').innerText = `₹${hCost.toLocaleString('en-IN')}`;
        document.getElementById('resSightUsed').innerText = `₹${sCost.toLocaleString('en-IN')}`;
        document.getElementById('resMarkupVal').innerText = `₹${Math.round(markupVal).toLocaleString('en-IN')}`;
        document.getElementById('resGstVal').innerText = `₹${Math.round(gstVal).toLocaleString('en-IN')}`;
        document.getElementById('resGrandTotal').innerText = `₹${Math.round(total).toLocaleString('en-IN')}`;
    }

    function recalcAll() {
        let h = 0; let s = 0;
        currentPlan.forEach(p => {
            h += (p.hotel?.cost || 0) * p.nights;
            s += p.sights.reduce((sum, x) => sum + x.price, 0);
        });
        updateTotals(h, s);
    }

    function openHotelSwap(routeId) {
        const item = currentPlan.find(p => p.id === routeId);
        const options = masterData.hotels.filter(h => h.city.toLowerCase() === item.city.toLowerCase());
        
        document.getElementById('modalTitle').innerText = `Hotels in ${item.city}`;
        document.getElementById('modalContent').innerHTML = options.map(h => `
            <div onclick="selectHotel(${routeId}, '${h.name}')" class="p-4 border-2 border-slate-100 rounded-2xl hover:border-emerald-500 hover:bg-emerald-50 cursor-pointer flex justify-between items-center transition-all group">
                <div>
                    <p class="font-black text-slate-800 group-hover:text-emerald-700">${h.name}</p>
                    <p class="text-xs text-slate-500 uppercase font-bold tracking-widest">${h.type} • ₹${h.cost}/nt</p>
                </div>
                <div class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg text-[10px] font-black uppercase">Select</div>
            </div>
        `).join('');
        toggleModal(true);
    }

    function selectHotel(routeId, name) {
        const item = currentPlan.find(p => p.id === routeId);
        item.hotel = masterData.hotels.find(h => h.name === name);
        renderProposal();
        toggleModal(false);
    }

    function openSightSwap(routeId) {
        const item = currentPlan.find(p => p.id === routeId);
        const options = masterData.sights.filter(s => s.city.toLowerCase().includes(item.city.toLowerCase()));
        
        document.getElementById('modalTitle').innerText = `Manage Activities: ${item.city}`;
        document.getElementById('modalContent').innerHTML = options.map(s => {
            const isSelected = item.sights.some(existing => existing.info === s.info);
            return `
                <div onclick="toggleSight(${routeId}, '${s.info}')" class="p-4 border-2 ${isSelected ? 'border-emerald-500 bg-emerald-50' : 'border-slate-100'} rounded-2xl cursor-pointer flex justify-between items-center transition-all">
                    <div>
                        <p class="font-black text-slate-800">${s.info}</p>
                        <p class="text-xs font-bold text-slate-400">₹${s.price.toLocaleString()}</p>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 ${isSelected ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-200'} flex items-center justify-center text-xs">
                        ${isSelected ? '✓' : '+'}
                    </div>
                </div>
            `;
        }).join('');
        toggleModal(true);
    }

    function toggleSight(routeId, info) {
        const item = currentPlan.find(p => p.id === routeId);
        const sightObj = masterData.sights.find(s => s.info === info);
        const index = item.sights.findIndex(s => s.info === info);
        if(index > -1) item.sights.splice(index, 1);
        else item.sights.push(sightObj);
        renderProposal();
        openSightSwap(routeId);
    }

    function toggleModal(show) { document.getElementById('swapModal').classList.toggle('hidden', !show); }
    function closeModal() { toggleModal(false); }

    init();
</script>
</body>
</html>
