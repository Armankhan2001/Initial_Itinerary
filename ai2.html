<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Architect | Intelligence Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); @apply border border-white shadow-2xl rounded-[2.5rem]; }
        .tab-btn { @apply px-8 py-4 font-bold text-sm tracking-widest uppercase transition-all border-b-4 border-transparent; }
        .tab-btn.active { @apply border-emerald-500 text-emerald-600 bg-emerald-50/50; }
        .input-premium { @apply w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all; }
        .card-anim { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-anim:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="p-4 lg:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-4xl font-black tracking-tighter">TRAVEL <span class="text-emerald-500">INTELLIGENCE</span></h1>
                <p class="text-slate-400 font-medium">Your Private Inventory & AI Optimization Suite</p>
            </div>
            <div id="status" class="bg-slate-900 text-white px-6 py-2 rounded-full text-[10px] font-bold tracking-widest uppercase">
                System Online
            </div>
        </header>

        <div class="flex border-b border-slate-200 mb-8 no-print">
            <button onclick="switchTab('planner')" id="tab-planner" class="tab-btn active">AI Optimizer</button>
            <button onclick="switchTab('explorer')" id="tab-explorer" class="tab-btn">Activity Explorer</button>
        </div>

        <div id="section-planner" class="space-y-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 glass p-8 space-y-6">
                    <h3 class="text-xl font-black italic text-emerald-600">01. Parameters</h3>
                    
                    <div class="space-y-4">
                        <label class="block text-[10px] font-black uppercase text-slate-400">Route Map</label>
                        <div class="flex gap-2">
                            <input type="text" list="cityList" id="cityInput" class="input-premium" placeholder="City">
                            <input type="number" id="nightInput" class="input-premium w-24" placeholder="Nts">
                            <button onclick="addCityToRoute()" class="bg-emerald-600 text-white px-6 rounded-2xl hover:bg-emerald-700 font-bold">+</button>
                        </div>
                        <div id="routeList" class="flex flex-wrap gap-2 p-3 bg-slate-50 rounded-2xl min-h-[50px]"></div>
                    </div>

                    <div class="space-y-4 pt-4 border-t">
                        <label class="block text-[10px] font-black uppercase text-slate-400">Financial Constraints</label>
                        <input type="number" id="hotelBudget" class="input-premium" placeholder="Hotel Budget (INR)" value="400000">
                        <input type="number" id="sightBudget" class="input-premium" placeholder="Activity Budget (INR)" value="200000">
                    </div>

                    <button onclick="runOptimizer()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase tracking-widest hover:bg-emerald-600 transition-all shadow-xl shadow-emerald-100">
                        Calculate Best Fit
                    </button>
                </div>

                <div class="lg:col-span-2 glass overflow-hidden flex flex-col">
                    <div class="p-8 border-b bg-white flex justify-between items-center">
                        <h3 class="font-black uppercase tracking-widest text-sm">Optimized Proposal</h3>
                        <div class="text-right">
                            <p class="text-[10px] font-bold text-slate-400">ESTIMATED TOTAL</p>
                            <p id="resGrandTotal" class="text-3xl font-black text-emerald-600">₹0</p>
                        </div>
                    </div>
                    <div class="flex-grow overflow-auto max-h-[600px]">
                        <table class="w-full text-left">
                            <tbody id="proposalBody">
                                <tr><td class="p-20 text-center text-slate-300 italic">Enter route and click calculate to generate proposal...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-explorer" class="hidden space-y-8">
            <div class="glass p-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Search Destination</label>
                        <input type="text" id="searchCity" oninput="filterExplorer()" class="input-premium" placeholder="Type city name...">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Price Sorting</label>
                        <select id="sortOrder" onchange="filterExplorer()" class="input-premium bg-white">
                            <option value="none">Default Sorting</option>
                            <option value="low">Price: Low to High</option>
                            <option value="high">Price: High to Low</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-3 p-4 bg-emerald-50 rounded-2xl">
                        <span class="text-xl">✨</span>
                        <p class="text-xs text-emerald-800 font-medium">Viewing <b>your live inventory</b> from Google Sheets.</p>
                    </div>
                </div>
            </div>

            <div id="explorerGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                </div>
        </div>

    </div>

    <datalist id="cityList"></datalist>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzYbmpf1dOUVJ2JAxr5UVeFCQL6sT6AaHP9N6gguF0Z0qaotsFJEzHa5jQnO39wsKMRnA/exec";
    let masterData = { hotels: [], sights: [] };
    let selectedRoute = [];

    async function init() {
        try {
            const res = await fetch(API_URL);
            masterData = await res.json();
            const cities = [...new Set(masterData.hotels.map(h => h.city))];
            document.getElementById('cityList').innerHTML = cities.map(c => `<option value="${c}">`).join('');
            filterExplorer(); // Initial load for explorer
        } catch (e) { console.error("Database connection failed."); }
    }

    function switchTab(tab) {
        document.getElementById('section-planner').classList.toggle('hidden', tab !== 'planner');
        document.getElementById('section-explorer').classList.toggle('hidden', tab !== 'explorer');
        document.getElementById('tab-planner').classList.toggle('active', tab === 'planner');
        document.getElementById('tab-explorer').classList.toggle('active', tab === 'explorer');
    }

    /* --- TAB 1 LOGIC --- */
    function addCityToRoute() {
        const city = document.getElementById('cityInput').value.trim();
        const nights = parseInt(document.getElementById('nightInput').value);
        if(!city || !nights) return;
        selectedRoute.push({ city, nights });
        document.getElementById('cityInput').value = "";
        document.getElementById('nightInput').value = "";
        renderRoute();
    }

    function renderRoute() {
        document.getElementById('routeList').innerHTML = selectedRoute.map((r, i) => `
            <span class="bg-white border px-3 py-1 rounded-full text-xs font-bold flex items-center gap-2">
                ${r.city} (${r.nights}N)
                <button onclick="selectedRoute.splice(${i},1); renderRoute();" class="text-red-400">×</button>
            </span>
        `).join('');
    }

    function runOptimizer() {
        const hBud = parseFloat(document.getElementById('hotelBudget').value) / selectedRoute.length;
        const sBud = parseFloat(document.getElementById('sightBudget').value) / selectedRoute.length;
        
        let html = '';
        let totalNet = 0;

        selectedRoute.forEach(r => {
            const bestHotels = masterData.hotels
                .filter(h => h.city.toLowerCase() === r.city.toLowerCase())
                .sort((a,b) => b.cost - a.cost);
            
            const hotel = bestHotels.find(h => (h.cost * r.nights) <= hBud) || bestHotels[bestHotels.length-1];
            
            const citySights = masterData.sights
                .filter(s => s.city.toLowerCase().includes(r.city.toLowerCase()))
                .sort((a,b) => b.price - a.price);

            let chosenSights = [];
            let currentS = 0;
            citySights.forEach(s => { if(currentS + s.price <= sBud) { chosenSights.push(s); currentS += s.price; }});

            const stayCost = (hotel?.cost || 0) * r.nights;
            totalNet += (stayCost + currentS);

            html += `
                <tr class="border-b">
                    <td class="p-8 w-1/3">
                        <p class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">${r.city}</p>
                        <h4 class="text-2xl font-black">${r.nights} Nights Stay</h4>
                    </td>
                    <td class="p-8">
                        <div class="mb-4">
                            <p class="text-xs font-bold text-slate-400 uppercase">Selected Accommodation</p>
                            <p class="font-bold text-slate-800">${hotel ? hotel.name : 'N/A'}</p>
                            <p class="text-xs text-slate-500 italic">${hotel ? hotel.type : ''}</p>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase">Selected Experiences</p>
                            ${chosenSights.map(s => `<p class="text-xs text-slate-600">• ${s.info}</p>`).join('')}
                        </div>
                    </td>
                </tr>
            `;
        });

        document.getElementById('proposalBody').innerHTML = html;
        const final = totalNet + (totalNet * 0.15) + (totalNet * 0.15 * 0.18);
        document.getElementById('resGrandTotal').innerText = `₹${Math.round(final).toLocaleString('en-IN')}`;
    }

    /* --- TAB 2 LOGIC --- */
    function filterExplorer() {
        const citySearch = document.getElementById('searchCity').value.toLowerCase();
        const sort = document.getElementById('sortOrder').value;

        let data = masterData.sights.filter(s => s.city.toLowerCase().includes(citySearch));
        
        if(sort === 'low') data.sort((a,b) => a.price - b.price);
        if(sort === 'high') data.sort((a,b) => b.price - a.price);

        document.getElementById('explorerGrid').innerHTML = data.map(s => `
            <div class="glass p-6 card-anim bg-white">
                <div class="flex justify-between items-start mb-4">
                    <span class="bg-blue-100 text-blue-700 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-tighter">${s.city}</span>
                    <span class="font-black text-slate-900 italic">₹${s.price.toLocaleString('en-IN')}</span>
                </div>
                <h4 class="font-bold text-slate-800 leading-tight mb-4 h-12 overflow-hidden">${s.info}</h4>
                <button onclick="getAiInsight('${s.city}')" class="w-full py-2 border border-slate-200 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-slate-900 hover:text-white transition-all">✨ Gemini Insight</button>
            </div>
        `).join('');
    }

    function getAiInsight(city) {
        alert(`Gemini Luxury Tip for ${city}: Avoid the tourist crowds between 10 AM and 2 PM. We recommend a private twilight tour for the best lighting and exclusive access.`);
    }

    init();
</script>
</body>
</html>
